[project]
name = "tbot"
version = "0.1.0"
description = "Autonomous trading bot for T-Investments (paper by default)"
requires-python = ">=3.11"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_any_generics = true

# Money and time must stay explicit; per-module strictness where it matters most.
[[tool.mypy.overrides]]
module = "trading_bot.risk_manager.*"
warn_return_any = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","B","I","UP","DTZ","SIM","RET","PTH","ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-datetimez]
# datetime.now() without tz is forbidden (see 02_CODING_RULES).
enforce-tz = true

[tool.black]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "red: expected failing until TODO(VERIFY) is resolved",
]
